kind = "mobile"
previewPath = "/mobile/"
title = "The Roof Store Mobile"
version = "1.0.0"
id = "artifacts/roof-store-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 23554

[services.development]
run = "pnpm --filter @workspace/roof-store-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roof-store-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/roof-store-mobile", "run", "serve" ]

[services.env]
PORT = "23554"
BASE_PATH = "/mobile/"
