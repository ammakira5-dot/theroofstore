kind = "web"
previewPath = "/"
title = "The Roof Store"
version = "1.0.0"
id = "artifacts/roof-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24639

[services.development]
run = "pnpm --filter @workspace/roof-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/roof-store", "run", "build" ]
publicDir = "artifacts/roof-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24639"
BASE_PATH = "/"
